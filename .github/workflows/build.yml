
name: Build Pixel Style Launcher

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          unzip -o PixelStyleLauncher-GitHub.zip -d buildsrc

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          cd buildsrc
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelStyleLauncher-debug-apk
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
